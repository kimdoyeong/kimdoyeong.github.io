<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 1450" width="1220" height="1450" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="arrEvt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
<marker id="arrTool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
<style>
.title { font-size: 22px; font-weight: 700; fill: #0f172a; }
.pkg { font-size: 12px; font-weight: 600; }
.hdr { font-size: 15px; font-weight: 700; fill: #0f172a; }
.sub { font-size: 11.5px; fill: #475569; }
.lbl { font-size: 12.5px; fill: #1e293b; }
.lblT { font-size: 12.5px; fill: #15803d; font-weight: 600; }
.lblE { font-size: 12.5px; fill: #6d28d9; font-weight: 600; }
.note { font-size: 12px; fill: #1e293b; }
.noteB { font-size: 12px; font-weight: 700; fill: #0f172a; }
.iter { font-size: 12.5px; font-weight: 700; fill: #92400e; }
.halo { paint-order: stroke; stroke: #fffdf5; stroke-width: 4px; stroke-linejoin: round; }
.life { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 5 5; }
.call { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
.ret { stroke: #334155; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#arr); }
.tool { stroke: #15803d; stroke-width: 1.8; fill: none; marker-end: url(#arrTool); }
.toolR { stroke: #15803d; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrTool); }
.evt { stroke: #7c3aed; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrEvt); }
.small { font-size: 12.5px; fill: #1e293b; }
.fbox { font-size: 13px; fill: #0f172a; font-weight: 600; }
</style>
</defs>
<rect width="1220" height="1450" fill="#ffffff"/>
<text x="610.0" y="32" text-anchor="middle" class="title">tool 호출이 필요한 경우의 흐름 — pi -p "poem.txt에 짧은 시를 한 편 써줘…"</text>

<rect x="210" y="46" width="370" height="1160" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-dasharray="6 4"/>
<text x="222" y="63" class="pkg" fill="#1d4ed8">coding-agent 패키지</text>
<rect x="590" y="46" width="200" height="1160" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-dasharray="6 4"/>
<text x="602" y="63" class="pkg" fill="#c2410c">agent 패키지</text>
<line x1="100" y1="128" x2="100" y2="1125" class="life"/>
<line x1="300" y1="128" x2="300" y2="1200" class="life"/>
<line x1="490" y1="128" x2="490" y2="1200" class="life"/>
<line x1="690" y1="128" x2="690" y2="1200" class="life"/>
<line x1="900" y1="128" x2="900" y2="1200" class="life"/>
<line x1="1110" y1="128" x2="1110" y2="1200" class="life"/>
<rect x="20.0" y="74" width="160" height="54" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="100" y="97" text-anchor="middle" class="hdr">터미널</text>
<text x="100" y="116" text-anchor="middle" class="sub">사용자</text>
<rect x="220.0" y="74" width="160" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="300" y="97" text-anchor="middle" class="hdr">main.ts · main()</text>
<text x="300" y="116" text-anchor="middle" class="sub">CLI · 프린트 모드</text>
<rect x="410.0" y="74" width="160" height="54" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="490" y="97" text-anchor="middle" class="hdr">AgentSession</text>
<text x="490" y="116" text-anchor="middle" class="sub">에이전트 세션</text>
<rect x="610.0" y="74" width="160" height="54" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="690" y="97" text-anchor="middle" class="hdr">Agent</text>
<text x="690" y="116" text-anchor="middle" class="sub">에이전트 루프</text>
<rect x="820.0" y="74" width="160" height="54" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="900" y="97" text-anchor="middle" class="hdr">도구</text>
<text x="900" y="116" text-anchor="middle" class="sub">read · write …</text>
<rect x="1030.0" y="74" width="160" height="54" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="1110" y="97" text-anchor="middle" class="hdr">LLM 모델</text>
<text x="1110" y="116" text-anchor="middle" class="sub">프로바이더 API</text>
<text x="200.0" y="160" text-anchor="middle" class="lbl halo">① pi -p "poem.txt에…"</text>
<line x1="100" y1="168" x2="298" y2="168" class="call"/>
<text x="395.0" y="200" text-anchor="middle" class="lbl halo">② 세션 생성 · 프롬프트 전달</text>
<line x1="300" y1="208" x2="488" y2="208" class="call"/>
<rect x="405.0" y="222" width="170" height="44" rx="6" fill="#ffffff" stroke="#0d9488"/>
<text x="490" y="240" text-anchor="middle" class="note">전처리 (슬래시 명령,</text>
<text x="490" y="257" text-anchor="middle" class="note">실행 중 프롬프트 확인)</text>
<text x="590.0" y="286" text-anchor="middle" class="lbl halo">③ prompt()</text>
<line x1="490" y1="294" x2="688" y2="294" class="call"/>
<rect x="598" y="312" width="602" height="736" rx="4" fill="#fffbeb" fill-opacity="0.6" stroke="#b45309" stroke-width="1.4"/>
<path d="M598,312 h330 v16 l-10,10 h-320 z" fill="#fde68a" stroke="#b45309" stroke-width="1.4"/>
<text x="607" y="331" class="noteB">loop · 에이전트 루프 — toolCall이 있는 동안 반복</text>
<text x="607" y="362" class="iter halo">1회차 · 파일이 있는지 확인</text>
<text x="900.0" y="382" text-anchor="middle" class="lbl halo">모델 호출 (대화 내역 + 프롬프트)</text>
<line x1="690" y1="390" x2="1108" y2="390" class="call"/>
<text x="900.0" y="414" text-anchor="middle" class="lbl halo">toolCall: read(poem.txt)</text>
<line x1="1110" y1="422" x2="692" y2="422" class="ret"/>
<text x="795.0" y="448" text-anchor="middle" class="lblT halo">execute()</text>
<line x1="690" y1="456" x2="898" y2="456" class="tool"/>
<text x="795.0" y="480" text-anchor="middle" class="lblT halo">결과: 파일 없음</text>
<line x1="900" y1="488" x2="692" y2="488" class="toolR"/>
<rect x="602.0" y="498" width="176" height="26" rx="6" fill="#ffffff" stroke="#ea580c"/>
<text x="690" y="516" text-anchor="middle" class="note">toolResult 메시지 추가</text>
<line x1="604" y1="532" x2="1194" y2="532" stroke="#d97706" stroke-dasharray="3 4"/>
<text x="607" y="554" class="iter halo">2회차 · 시 작성</text>
<text x="900.0" y="574" text-anchor="middle" class="lbl halo">모델 호출 (+ toolResult)</text>
<line x1="690" y1="582" x2="1108" y2="582" class="call"/>
<text x="900.0" y="606" text-anchor="middle" class="lbl halo">toolCall: write(poem.txt, 시)</text>
<line x1="1110" y1="614" x2="692" y2="614" class="ret"/>
<text x="795.0" y="640" text-anchor="middle" class="lblT halo">execute()</text>
<line x1="690" y1="648" x2="898" y2="648" class="tool"/>
<text x="795.0" y="672" text-anchor="middle" class="lblT halo">결과: 작성 완료</text>
<line x1="900" y1="680" x2="692" y2="680" class="toolR"/>
<rect x="602.0" y="690" width="176" height="26" rx="6" fill="#ffffff" stroke="#ea580c"/>
<text x="690" y="708" text-anchor="middle" class="note">toolResult 메시지 추가</text>
<line x1="604" y1="724" x2="1194" y2="724" stroke="#d97706" stroke-dasharray="3 4"/>
<text x="607" y="746" class="iter halo">3회차 · 잘 써졌는지 확인</text>
<text x="900.0" y="766" text-anchor="middle" class="lbl halo">모델 호출 (+ toolResult)</text>
<line x1="690" y1="774" x2="1108" y2="774" class="call"/>
<text x="900.0" y="798" text-anchor="middle" class="lbl halo">toolCall: read(poem.txt)</text>
<line x1="1110" y1="806" x2="692" y2="806" class="ret"/>
<text x="795.0" y="832" text-anchor="middle" class="lblT halo">execute()</text>
<line x1="690" y1="840" x2="898" y2="840" class="tool"/>
<text x="795.0" y="864" text-anchor="middle" class="lblT halo">결과: 시 내용</text>
<line x1="900" y1="872" x2="692" y2="872" class="toolR"/>
<rect x="602.0" y="882" width="176" height="26" rx="6" fill="#ffffff" stroke="#ea580c"/>
<text x="690" y="900" text-anchor="middle" class="note">toolResult 메시지 추가</text>
<line x1="604" y1="916" x2="1194" y2="916" stroke="#d97706" stroke-dasharray="3 4"/>
<text x="607" y="938" class="iter halo">4회차 · 완료 보고</text>
<text x="900.0" y="958" text-anchor="middle" class="lbl halo">모델 호출 (+ toolResult)</text>
<line x1="690" y1="966" x2="1108" y2="966" class="call"/>
<text x="900.0" y="990" text-anchor="middle" class="lbl halo">텍스트 응답: "완료되었습니다"</text>
<line x1="1110" y1="998" x2="692" y2="998" class="ret"/>
<rect x="602.0" y="1012" width="176" height="26" rx="6" fill="#ffffff" stroke="#ea580c"/>
<text x="690" y="1030" text-anchor="middle" class="note">toolCall 없음 → 루프 종료</text>
<text x="900" y="1034" text-anchor="middle" class="sub halo">(도구 실행 없음)</text>
<text x="495.0" y="1070" text-anchor="middle" class="lblE halo">④ message_end 이벤트</text>
<line x1="690" y1="1078" x2="302" y2="1078" class="evt"/>
<text x="200.0" y="1104" text-anchor="middle" class="lblE halo">⑤ 화면 버퍼에 출력</text>
<line x1="300" y1="1112" x2="102" y2="1112" class="evt"/>
<text x="590.0" y="1138" text-anchor="middle" class="lblE halo">⑥ agent_end</text>
<line x1="690" y1="1146" x2="492" y2="1146" class="evt"/>
<rect x="405.0" y="1160" width="170" height="28" rx="6" fill="#ffffff" stroke="#0d9488"/>
<text x="490" y="1178" text-anchor="middle" class="note">대화 기록 저장 (영속화)</text>
<rect x="10" y="1132" width="190" height="62" rx="8" fill="#0f172a"/>
<text x="22" y="1155" font-family="Menlo, Consolas, monospace" font-size="12" fill="#94a3b8">$ pi -p "poem.txt에…"</text>
<text x="22" y="1180" font-size="12.5" fill="#e2e8f0">완료되었습니다.</text>
<rect x="20" y="1222" width="1180" height="178" rx="10" fill="#fffbeb" stroke="#b45309"/>
<text x="40" y="1250" class="noteB" fill="#92400e" font-size="14">에이전트 루프 종료 조건</text>
<rect x="60" y="1278" width="170" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="145.0" y="1305" text-anchor="middle" class="fbox">모델 호출</text>
<path d="M380,1262 L475,1300 L380,1338 L285,1300 z" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
<text x="380" y="1305" text-anchor="middle" class="fbox">응답에 toolCall?</text>
<rect x="540" y="1278" width="200" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="640.0" y="1305" text-anchor="middle" class="fbox">execute()로 도구 실행</text>
<rect x="790" y="1278" width="190" height="44" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="885.0" y="1305" text-anchor="middle" class="fbox">toolResult 메시지 추가</text>
<rect x="1010" y="1278" width="170" height="44" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="1095.0" y="1305" text-anchor="middle" class="fbox">루프 종료 → agent_end</text>
<line x1="230" y1="1300" x2="283" y2="1300" class="call"/>
<line x1="475" y1="1300" x2="538" y2="1300" class="tool"/>
<text x="507.5" y="1292" text-anchor="middle" class="lblT">예</text>
<line x1="740" y1="1300" x2="788" y2="1300" class="call"/>
<path d="M380,1262 V1262 H1095 V1276" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="392" y="1256" class="lbl" font-weight="600">아니오</text>
<path d="M885,1322 V1356 H145 V1324" fill="none" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="515" y="1376" text-anchor="middle" class="lbl">다시 모델 호출 (반복) — 이 반복 구조를 “에이전트 루프”라고 부른다</text>
<line x1="40" y1="1428" x2="90" y2="1428" class="call"/>
<text x="100" y="1432" class="small">호출 · 전달</text>
<line x1="210" y1="1428" x2="260" y2="1428" class="ret"/>
<text x="270" y="1432" class="small">모델 응답</text>
<line x1="380" y1="1428" x2="430" y2="1428" class="tool"/>
<text x="440" y="1432" class="small">도구 실행</text>
<line x1="550" y1="1428" x2="600" y2="1428" class="toolR"/>
<text x="610" y="1432" class="small">도구 결과</text>
<line x1="720" y1="1428" x2="770" y2="1428" class="evt"/>
<text x="780" y="1432" class="small">이벤트</text>
<rect x="890" y="1419" width="50" height="18" fill="#fffbeb" stroke="#b45309"/>
<text x="950" y="1432" class="small">루프 구간</text>
</svg>